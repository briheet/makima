[workspace]
resolver = "3"
members = [
    "crates/makima-core",
    "crates/makima-tui",
    "crates/makima-store",
    "crates/makima-ffi",
    "crates/makima-cli",
    "crates/uniffi-bindgen",
]
# Plain `cargo build/test/run` skip the bindgen tool; `just bindings` runs it with `-p`.
default-members = [
    "crates/makima-core",
    "crates/makima-tui",
    "crates/makima-store",
    "crates/makima-ffi",
    "crates/makima-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
makima-core = { path = "crates/makima-core" }
makima-tui = { path = "crates/makima-tui" }
makima-store = { path = "crates/makima-store" }
etcetera = "0.11.0"
hex = "0.4.3"
jiff = "0.2.37"
nucleo-matcher = "0.3.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
sha2 = "0.11.0"
walkdir = "2.5.0"
ratatui = { version = "0.30.2", default-features = false }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-oslog = "0.3.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
toml = "1.1.6"
uniffi = "0.32.2"
uuid = { version = "1.27.0", features = ["v4", "v7", "serde"] }
# Test-only
assert_cmd = "2.2.2"
criterion = "0.8.2"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
# panic stays "unwind": UniFFI turns Rust panics into Swift errors at the boundary.

[profile.profiling]
inherits = "release"
strip = false

[profile.dev.package."*"]
opt-level = 2
